<div
  class="flex flex-col gap-4 border-b border-slate-200 pb-5 md:flex-row md:items-end md:justify-between"
>
  <div class="space-y-2">
    @if (eyebrow(); as eyebrowText) {
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">
        {{ eyebrowText }}
      </p>
    }

    <div class="space-y-1">
      <h1 class="text-3xl font-semibold tracking-tight text-slate-950">{{ title() }}</h1>

      @if (description(); as descriptionText) {
        <p class="max-w-3xl text-sm leading-6 text-slate-600">
          {{ descriptionText }}
        </p>
      }
    </div>
  </div>

  @if (actionLabel() && actionLink()) {
    <a hlmBtn [routerLink]="actionLink()"> {{ actionLabel() }} </a>
  }
</div>
